spring.application.name=nota
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nota}
spring.datasource.username=${DB_USERNAME:nota}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{trazabilidad:-}]

nota.azure.identidad.endpoint=${IDENTITY_ENDPOINT:}
nota.azure.identidad.encabezado=${IDENTITY_HEADER:}
nota.baul.url=${AZURE_KEY_VAULT_URL:}
nota.baul.secreto-base-datos=${BAUL_SECRETO_BASE_DATOS:db-password}
nota.baul.cache-minutos=${BAUL_CACHE_MINUTOS:60}
nota.catalogo.endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}
nota.catalogo.cache-segundos=${CATALOGO_CACHE_SEGUNDOS:300}
nota.notificaciones.remitente=${NOTIFICACION_REMITENTE:}
nota.notificaciones.secreto=${NOTIFICACION_SECRETO:acs-conexion}
