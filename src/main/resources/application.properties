spring.application.name=nota
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nota}
spring.datasource.username=${DB_USERNAME:nota}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.messages.basename=mensajes/mensajes
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{trazabilidad:-}]
